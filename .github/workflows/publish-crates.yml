name: Publish crates to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish with --dry-run (no upload)"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Seconds to wait after each publish for the crates.io index to
      # propagate before the next dependent crate is published. See
      # RELEASE.md §1.
      PROPAGATION_SLEEP: "45"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ws_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag version:       $tag"
          echo "Workspace version: $ws_version"
          if [[ "$tag" != "$ws_version" ]]; then
            echo "::error::Tag v$tag does not match workspace version $ws_version"
            exit 1
          fi

      - name: Publish crates in topological order
        run: |
          set -euo pipefail

          crates=(
            oharness-core
            oharness-llm
            oharness-tools
            oharness-memory
            oharness-trace
            oharness-budget
            oharness-critic
            oharness-providers
            oharness-loop
            oharness-eval
            oharness-bench-swe
          )

          extra_args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            extra_args+=("--dry-run")
          fi

          for crate in "${crates[@]}"; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate" "${extra_args[@]}"
            echo "::endgroup::"

            if [[ "${{ inputs.dry_run }}" != "true" ]] && [[ "$crate" != "${crates[-1]}" ]]; then
              echo "Sleeping ${PROPAGATION_SLEEP}s for crates.io index to propagate..."
              sleep "${PROPAGATION_SLEEP}"
            fi
          done
