[package]
name = "oharness-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Event sinks, trajectory JSONL writer/reader, and ReplayLlm for open-harness"
readme = "README.md"
keywords = ["trace", "events", "jsonl", "llm", "observability"]
categories = ["development-tools::debugging", "asynchronous"]

[lints]
workspace = true

[features]
default = ["file-sink", "jsonl"]
file-sink = []
jsonl = []

[dependencies]
oharness-core = { workspace = true }
oharness-llm = { workspace = true }
oharness-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
