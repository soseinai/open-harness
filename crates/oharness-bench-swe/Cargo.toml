[package]
name = "oharness-bench-swe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SWE-bench (lite + full) adapter for open-harness"
readme = "README.md"
keywords = ["swe-bench", "benchmark", "llm", "agent", "eval"]
categories = ["development-tools::testing", "science"]

[lints]
workspace = true

[features]
default = []

[dependencies]
oharness-core = { workspace = true }
oharness-eval = { workspace = true }
oharness-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
