[package]
name = "oharness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Core types, event schema, and context-plumbing traits for open-harness"
readme = "README.md"
keywords = ["llm", "agent", "schema", "events", "research"]
categories = ["development-tools", "science"]

[lints]
workspace = true

[features]
default = []
# Plan §19.2: derive `JsonSchema` for Event + its transitive closure
# so a script can emit the canonical schema file CI diffs against. No
# default-on schemars dep; only `schemars-export`-gated builds pay.
schemars-export = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true, optional = true }
