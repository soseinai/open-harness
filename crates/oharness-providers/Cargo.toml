[package]
name = "oharness-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "LLM provider adapters (Anthropic, OpenAI, OpenRouter, Ollama, vLLM) for open-harness"
readme = "README.md"
keywords = ["anthropic", "openai", "llm", "provider"]
categories = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[features]
default = ["anthropic"]
anthropic = ["reqwest"]
openai = ["reqwest"]
openai-codex = ["reqwest", "sha2", "uuid"]
# OpenAI-compatible deployments. Each pulls in the core `openai` adapter —
# they're thin factories over `OpenAiLlm` with different base URLs, auth,
# and provider names.
openrouter = ["openai"]
ollama = ["openai"]
vllm = ["openai"]

[dependencies]
oharness-core = { workspace = true }
oharness-llm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, optional = true }
tracing = { workspace = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
wiremock = "0.6"
